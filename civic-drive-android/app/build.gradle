plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.civicdrive'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.civicdrive'
        minSdk 24
        targetSdk 35
        versionCode 28
        versionName '2.0.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
