name: Civic Drive Rebuild QA
on:
  push:
    branches: [civic-drive-plasma-20261123]
    paths:
      - 'civic-drive-android/**'
      - '.github/workflows/civic-drive-rebuild-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter o código em teste
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verificar requisitos de simplicidade e segurança
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=civic-drive-android
          C="$ROOT/app/src/main/java/br/com/civicdrive"
          grep -q "versionCode 35" "$ROOT/app/build.gradle"
          grep -q "versionName '2.1.1'" "$ROOT/app/build.gradle"
          test -s "$C/GarageActivity.java"
          grep -q 'setCarColor' "$C/CivicCarView.java"
          grep -q 'setZoom' "$C/CivicCarView.java"
          grep -q 'setOffset' "$C/CivicCarView.java"
          grep -q 'new CivicOrbRenderer' "$C/MainActivity.java"
          grep -q 'KEYCODE_MEDIA_NEXT' "$C/MainActivity.java"
          grep -q 'getBoolean("stable",true)' "$C/MainActivity.java"
          grep -q 'boolean stableMode=true' "$C/ObdManager.java"
          grep -q 'boolean probeExtra=!stableMode' "$C/ObdManager.java"
          grep -q 'drawColor(BLACK)' "$C/MainActivity.java"
          grep -q 'GarageActivity' "$ROOT/app/src/main/AndroidManifest.xml"
          if grep -q 'optionalCommand(out,in,"ATZ"' "$C/ObdManager.java"; then
            echo "REPROVADO: hard-reset ELM327 voltou"; exit 1
          fi
          if grep -q 'approvedBackdrop' "$C/MainActivity.java"; then
            echo "REPROVADO: imagem estática na home"; exit 1
          fi
          grep -q 'for(int i=0;i<12;i++)' "$C/CivicOrbRenderer.java"
          grep -q 'private void lightning(' "$C/CivicOrbRenderer.java"
          grep -q 'glowArc(' "$C/CivicOrbRenderer.java"
          if grep -q 'new Visualizer(' "$C/MusicReactive.java"; then echo 'Audio capture forbidden'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, hashlib
          p=Path('civic-drive-android/app/src/main/java/br/com/civicdrive/CivicPlasmaReference.java')
          text=p.read_text()
          match=re.search(r'Base64\.decode\("([^"]+)"',text)
          assert match, 'approved plasma asset missing'
          blob=base64.b64decode(match.group(1),validate=True)
          assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP'
          expected='fa46dd66183051386528e845dda5c9c9c8ebd0697fc333ab01e29a4ec1ed8ab2'
          actual=hashlib.sha256(blob).hexdigest()
          assert actual==expected, f'plasma image does not match approved reference crop: {actual}'
          print('OK: approved plasma image exact SHA256:',actual)
          PY
          echo "OK: black/neon, music, stable ELM327 and original plasma."
      - name: Compilar release sem assinar nem publicar
        run: gradle --no-daemon --stacktrace assembleRelease
        working-directory: civic-drive-android
      - name: Executar testes locais
        run: gradle --no-daemon testDebugUnitTest
        working-directory: civic-drive-android
