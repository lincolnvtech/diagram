name: Civic G8 - Auditoria da base v2
on:
  push:
    branches: [civic-drive-build]
    paths: ['.github/workflows/civic-updater-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civic-drive-build
      - name: Inspecionar a base Android original sem alterar produção
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source
          base64 --decode civic-drive/source-zip.base64 > /tmp/civic-source.zip
          unzip -q /tmp/civic-source.zip -d source
          echo '=== PROJECT FILES ==='
          find source/app/src/main -maxdepth 5 -type f | sort
          echo '=== GRADLE ==='
          sed -n '1,220p' source/app/build.gradle
          echo '=== MANIFEST ==='
          sed -n '1,260p' source/app/src/main/AndroidManifest.xml
          for f in MainActivity.java DashboardActivity.java ObdManager.java GearEstimator.java UpdateManager.java NovaActivity.java; do
            p="source/app/src/main/java/br/com/civicdrive/$f"
            if [ -f "$p" ]; then
              echo "=== $f ==="
              sed -n '1,420p' "$p"
            fi
          done
          echo '=== LAYOUT / DRAWABLE / ASSETS ==='
          find source/app/src/main/res -maxdepth 3 -type f | sort | head -200
          find source/app/src/main/assets -maxdepth 3 -type f -print 2>/dev/null || true
