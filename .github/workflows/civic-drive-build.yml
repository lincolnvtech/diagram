# Civic Drive v2.0.5: build directly from integrated Android sources, no patch chain.
name: Civic G8 - APK assinado permanente
on:
  push:
    branches: [civic-drive-build]
    paths:
      - 'civic-drive-android/**'
      - 'civic-drive/signing.enc.json'
      - '.github/workflows/civic-drive-build.yml'
  workflow_dispatch:

jobs:
  assemble-signed-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obter o projeto isolado
        uses: actions/checkout@v4
        with:
          ref: civic-drive-build
      - name: Verificar se o segredo permanente foi configurado
        env:
          CIVIC_SIGNING_KEY: ${{ secrets.CIVIC_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$CIVIC_SIGNING_KEY" ]; then
            echo 'Configure CIVIC_SIGNING_KEY em Settings > Secrets and variables > Actions para liberar a compilacao assinada.'
            exit 1
          fi
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar projeto Android consolidado
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=civic-drive-android
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/java/br/com/civicdrive/MainActivity.java"
          test -f "$ROOT/app/src/main/java/br/com/civicdrive/MusicReactive.java"
          grep -q 'versionCode 28' "$ROOT/app/build.gradle"
          grep -q "versionName '2.0.5'" "$ROOT/app/build.gradle"
          grep -q 'musicReactive.frame' "$ROOT/app/src/main/java/br/com/civicdrive/MainActivity.java"
          grep -q 'private void orb(Canvas c)' "$ROOT/app/src/main/java/br/com/civicdrive/MainActivity.java"
          grep -q 'AudioManager' "$ROOT/app/src/main/java/br/com/civicdrive/MusicReactive.java"
          if grep -q 'toggleMusicReactive' "$ROOT/app/src/main/java/br/com/civicdrive/MainActivity.java"; then
            echo 'Falha: ainda existe opção manual de música.'
            exit 1
          fi
          echo 'OK: projeto consolidado, áudio automático e versão verificada.'
      - name: Instalar ferramentas do Android
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar verificador AES-GCM
        run: python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.4'
      - name: Compilar e assinar com a chave permanente
        env:
          CIVIC_SIGNING_KEY: ${{ secrets.CIVIC_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os, subprocess, json, base64, pathlib, tempfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = pathlib.Path.cwd()
          secret = os.environ.get('CIVIC_SIGNING_KEY', '').strip()
          if not secret:
              raise SystemExit('ERRO: Configure o segredo CIVIC_SIGNING_KEY em Settings > Secrets and variables > Actions. Nao foi publicado APK sem assinatura.')
          raw_key = base64.b64decode(secret, validate=True)
          if len(raw_key) != 32:
              raise SystemExit('ERRO: CIVIC_SIGNING_KEY invalida; deve ter 32 bytes em base64.')
          enc = json.loads((root/'civic-drive/signing.enc.json').read_text())
          if enc.get('format') != 1 or enc.get('algorithm') != 'AES-256-GCM':
              raise SystemExit('ERRO: Formato de assinatura nao reconhecido.')
          bundle = json.loads(AESGCM(raw_key).decrypt(
              base64.b64decode(enc['nonce']),
              base64.b64decode(enc['ciphertext']),
              b'CIVIC-G8-RELEASE-SIGNING-V1'))
          if bundle.get('alias') != 'civic-g8-release':
              raise SystemExit('ERRO: Alias de assinatura divergente.')
          android_tools = pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          unsigned = root/'civic-drive-android/app/build/outputs/apk/release/app-release-unsigned.apk'
          signed = root/'civic-drive/civic-drive-v2.0.5.apk'
          with tempfile.TemporaryDirectory(prefix='civic-sign-') as temporary:
              keystore = pathlib.Path(temporary)/'release.p12'
              keystore.write_bytes(base64.b64decode(bundle['keyStore']))
              os.chmod(keystore, 0o600)
              subprocess.run(['gradle', '--no-daemon', '--stacktrace', 'assembleRelease'], cwd=root/'civic-drive-android',check=True)
              if not unsigned.is_file() or unsigned.stat().st_size < 1000:
                  raise SystemExit('ERRO: APK release nao foi compilado.')
              env = os.environ.copy()
              env['CIVIC_STORE_PASSWORD'] = bundle['storePassword']
              env['CIVIC_KEY_PASSWORD'] = bundle['keyPassword']
              subprocess.run([str(android_tools/'apksigner'), 'sign',
                  '--ks', str(keystore), '--ks-type', 'PKCS12',
                  '--ks-key-alias', bundle['alias'],
                  '--ks-pass', 'env:CIVIC_STORE_PASSWORD',
                  '--key-pass', 'env:CIVIC_KEY_PASSWORD',
                  '--out', str(signed), str(unsigned)], env=env,check=True)
              certs = subprocess.check_output([str(android_tools/'apksigner'), 'verify',
                  '--min-sdk-version','24','--verbose','--print-certs',str(signed)], text=True)
              expected = 'e1259f300052309981546e568f78903c2daa013f86a3c4cf6a46ade49de97374'
              if expected not in certs.replace(':','').lower():
                  raise SystemExit('ERRO: O certificado nao corresponde a chave permanente esperada.')
          print('APK v2.0.5 validado com assinatura permanente.')
          PY
      - name: Publicar APK e manifesto da atualizacao
        shell: bash
        run: |
          set -Eeuo pipefail
          APK=civic-drive/civic-drive-v2.0.5.apk
          test -s "$APK"
          cp "$APK" civic-drive/civic-drive-latest.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          printf '{"versionCode":28,"versionName":"2.0.5","apkUrl":"https://raw.githubusercontent.com/lincolnvtech/diagram/civic-drive-build/civic-drive/civic-drive-v2.0.5.apk","sha256":"%s"}\n' "$SHA" > civic-drive/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add civic-drive/civic-drive-v2.0.5.apk civic-drive/civic-drive-latest.apk civic-drive/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: Civic G8 2.0.5 esfera musical automatica e fonte consolidada'
            git push origin HEAD:civic-drive-build
          fi
      - name: Guardar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: civic-g8-v2.0.5-release
          path: civic-drive/civic-drive-v2.0.5.apk