name: Civic Drive - Compilar APK
on:
  push:
    branches:
      - civic-drive-build
    paths:
      - 'civic-drive/source-zip.base64'
      - '.github/workflows/civic-drive-build.yml'
  workflow_dispatch:
jobs:
  assemble-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: civic-drive-build
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar codigo-fonte
        run: |
          mkdir -p build-civic
          base64 --decode civic-drive/source-zip.base64 > /tmp/civic-drive-src.zip
          unzip -q /tmp/civic-drive-src.zip -d build-civic
          test -f build-civic/app/build.gradle
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de teste
        working-directory: build-civic
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Conferir APK
        run: |
          test -s build-civic/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-civic/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar instalador na branch isolada
        run: |
          mkdir -p civic-drive
          cp build-civic/app/build/outputs/apk/debug/app-debug.apk civic-drive/civic-drive-v1.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add civic-drive/civic-drive-v1.2.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: Civic Drive 1.2 APK de teste"
            git push origin HEAD:civic-drive-build
          fi
      - name: APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: civic-drive-v1-2-installavel
          path: build-civic/app/build/outputs/apk/debug/app-debug.apk
