name: Civic Drive G8 - Compilar APK
on:
  push:
    branches: [civic-drive-build]
    paths:
      - 'civic-drive/source-zip.base64'
      - '.github/workflows/civic-drive-build.yml'
  workflow_dispatch:
jobs:
  assemble-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: civic-drive-build
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar codigo Android
        run: |
          mkdir -p build-civic
          base64 -d civic-drive/source-zip.base64 > /tmp/civic-g8-src.zip
          unzip -q /tmp/civic-g8-src.zip -d build-civic
          test -f build-civic/app/build.gradle
          grep -q "versionName '1.5.0'" build-civic/app/build.gradle
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        working-directory: build-civic
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Conferir e publicar instalador
        run: |
          APK=build-civic/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p civic-drive
          cp "$APK" civic-drive/civic-drive-v1.5.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          printf '{"versionCode":6,"versionName":"1.5.0","apkUrl":"https://raw.githubusercontent.com/lincolnvtech/diagram/civic-drive-build/civic-drive/civic-drive-v1.5.apk","sha256":"%s"}\n' "$SHA" > civic-drive/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add civic-drive/civic-drive-v1.5.apk civic-drive/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: Civic G8 1.5 APK de teste"
            git push origin HEAD:civic-drive-build
          fi
      - name: Guardar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: civic-g8-v1.5-debug-apk
          path: build-civic/app/build/outputs/apk/debug/app-debug.apk
