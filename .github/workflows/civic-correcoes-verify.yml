name: Civic Drive - Verificar correcoes antes de publicar
on:
  push:
    branches: [civic-drive-fixes-20261122]
  workflow_dispatch:
concurrency:
  group: civic-correcoes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests Java puros: CAN, KWP, URL e relógio
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/civic-javatest
          javac -encoding UTF-8 -d /tmp/civic-javatest \
            civic-drive-android/app/src/main/java/br/com/civicdrive/{DtcDecoder,UpdatePolicy}.java \
            civic-drive-android/tests/br/com/civicdrive/CorrecoesSmokeTest.java
          java -cp /tmp/civic-javatest br.com.civicdrive.CorrecoesSmokeTest
      - name: Compilacao completa Android (nao publica APK)
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          cd civic-drive-android
          gradle --no-daemon assembleDebug
